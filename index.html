<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbeitszeitrechner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="calculator-container">
      <h1 id="main-title">Arbeitszeitrechner</h1>
      <p class="subtitle" id="subtitle">Berechnen Sie Ihre Arbeitszeit mit Pausenregelungen</p>
      <form id="calculator-form">
        <div class="form-group">
          <label for="start-time">Arbeitszeitbeginn (Uhrzeit)</label>
          <input type="time" id="start-time" required>
        </div>
        <div class="form-group">
          <label for="end-time">Arbeitszeitende (Uhrzeit)</label>
          <input type="time" id="end-time" required>
        </div>
        <div class="form-group">
          <label for="break-time">Pause (Minuten)</label>
          <input type="number" id="break-time" min="0" step="1" value="0" required>
          <span class="input-hint">z.B. 30 für 30 Minuten Pause</span>
        </div>
        <div class="form-group">
          <label for="additional-break">Zusätzliche Pause (Minuten)</label>
          <input type="number" id="additional-break" min="0" step="1" value="0" required>
          <span class="input-hint">z.B. 15 für 15 Minuten zusätzliche Pause</span>
        </div>
        <div class="button-group">
          <button type="submit" class="btn-calculate" id="calculate-btn">Berechnen</button>
          <button type="button" class="btn-reset" id="reset-btn">Zurücksetzen</button>
        </div>
      </form>
      <div class="error-message" id="error-message"></div>
      <div class="result-section" id="result-section">
        <div class="result-item">
          <div class="result-label">Bruttoarbeitszeit</div>
          <div class="result-value" id="gross-working-time">0 Std</div>
        </div>
        <div class="result-item">
          <div class="result-label">Gesamte Pausenzeit</div>
          <div class="result-value" id="total-break-time">0 Min</div>
        </div>
        <div class="result-item">
          <div class="result-label">Nettoarbeitszeit</div>
          <div class="result-value highlight" id="net-working-time">0 Std</div>
        </div>
        <div id="warnings-section"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
